/* ---------- js/app.js ---------- */
(function () {
  const U = window.BC_UTILS;
  const C = window.BC_CONFIG;
  const S = window.BC_STORE;
  const UI = window.BC_UI;
  const API = window.BC_API;
  const $ = UI.$;

  /* ---------------- data ---------------- */

  /* `expectAtLeast` is how many rows the voucher should have after a save that
     just succeeded. Creator can serve a read taken straight after a write from
     the record as it was before it, which would redraw the table without the row
     that was just added — so the fetch is retried briefly until the count catches
     up, and only then does the table redraw. */
  function loadItems(expectAtLeast, attempt) {
    const tries = attempt || 0;
    UI.loading(true);
    return API.getItems()
      .then((rows) => {
        if (expectAtLeast && rows.length < expectAtLeast && tries < 3) {
          console.log('[barcode] voucher still reports ' + rows.length + ' row(s), expected ' +
            expectAtLeast + ' — refetching.');
          return new Promise((done) => setTimeout(done, 400 * (tries + 1)))
            .then(() => loadItems(expectAtLeast, tries + 1));
        }
        S.setItems(withCategory(rows));
        return fillMissingCategories(rows);
      })
      .catch((err) => UI.toast('Could not load items: ' + U.errText(err), 'error'))
      .then(() => UI.loading(false));
  }

  /* Category is not stored on the subform — it belongs to the item. Each row is
     given one derived from the Item_Master record its Item_Detail lookup names,
     which is what makes the CATEGORY column, and the search and filter over it,
     work at all. */
  let itemCategoryById = {};

  const categoryOf = (masterRow) =>
    masterRow ? fieldText(masterRow, C.itemMasterFields.categoryCandidates) : '';

  const itemFieldName = () =>
    (C.subformFields.Item_Name && C.subformFields.Item_Name.field) || '';

  function withCategory(rows) {
    const itemField = itemFieldName();
    if (!itemField) return rows;
    return rows.map((r) => {
      const id = rawId(r[itemField]);
      const cat = id ? itemCategoryById[id] : '';
      return cat ? Object.assign({}, r, { Category: cat }) : r;
    });
  }

  /* The Item_Master listing carries only the fields its report displays, so an
     item whose category is absent there is fetched in full — once, cached — and
     the table redrawn with what came back. */
  function fillMissingCategories(rows) {
    const itemField = itemFieldName();
    if (!itemField) return Promise.resolve();

    const missing = [];
    rows.forEach((r) => {
      const id = rawId(r[itemField]);
      if (id && !itemCategoryById[id] && missing.indexOf(id) === -1) missing.push(id);
    });
    if (!missing.length) return Promise.resolve();

    console.log('[barcode] fetching full Item_Master records for category: ' + missing.join(', '));
    return Promise.all(missing.map((id) => itemDetail(id).then((rec) => {
      const cat = categoryOf(rec);
      if (cat) {
        itemCategoryById[id] = cat;
      } else if (rec) {
        console.warn('[barcode] item ' + id + ' has no ' +
          JSON.stringify(C.itemMasterFields.categoryCandidates) + '. Full record keys: ' +
          Object.keys(rec).join(', '));
      } else {
        console.warn('[barcode] item ' + id + ' could not be read from ' + C.reports.itemMaster +
          ' — the row points at a record that is not there.');
      }
    }).catch(() => {}))).then(() => S.setItems(withCategory(rows)));
  }

  /* Fills a <select> from a Creator report. Every failure mode names itself in the
     dropdown, so an empty picker is never mistaken for "no records". */
  function fillSelect(sel, placeholder, reportName, labelField, codeField) {
    sel.innerHTML = '<option value="">' + placeholder + '</option>';

    if (!API.hasSDK()) {
      sel.innerHTML += '<option value="" disabled>Unavailable outside Zoho Creator</option>';
      return Promise.resolve();
    }

    return API.getLookup(reportName, labelField).then((list) => {
      if (!list.length) {
        sel.innerHTML += '<option value="" disabled>No records in ' + reportName + '</option>';
        return;
      }
      list.forEach((s) => {
        const o = document.createElement('option');
        o.value = s.ID;
        o.textContent = s.label;
        if (codeField) o.dataset.code = U.zohoText(s.row && s.row[codeField]);
        sel.appendChild(o);
      });
    }).catch((err) => {
      sel.innerHTML += '<option value="" disabled>Failed to load from ' + reportName + '</option>';
      UI.toast('Vendor/price lookup failed: ' + U.errText(err), 'error');
    });
  }

  function loadVendors() {
    return fillSelect($('#vendor'), 'Select Vendor', C.reports.vendor, C.vendorFields.label, C.vendorFields.code);
  }

  function loadPriceLevels() {
    const sel = $('#priceLevel');
    return fillSelect(sel, 'Select Price Level', C.reports.priceLevel, C.priceLevelFields.label)
      .then(() => {
        /* a single real choice is picked automatically, so Save never sends an
           empty Price_Level just because nobody had to touch the dropdown */
        const real = Array.prototype.filter.call(sel.options, (o) => o.value);
        if (!sel.value && real.length === 1) sel.value = real[0].value;
        S.setVoucher({ priceLevel: sel.value });
      });
  }

  /* Counts this year's existing numbers and takes the next one, the same way the
     Sales Invoice widget derives its invoice number. */
  function loadInvoiceNumber() {
    const cfg = C.invoiceNumberConfig;
    const report = C.reports[cfg.countReport] || cfg.countReport;
    const el = $('#invoiceNumber');
    const yearPrefix = cfg.prefix + '-' + String(new Date().getFullYear()).slice(-2) + '-';

    const apply = (n) => {
      const value = yearPrefix + String(n).padStart(cfg.padLength, '0');
      el.value = value;
      S.setVoucher({ invoiceNumber: value });
    };

    if (!API.hasSDK()) {
      const offlineCount = parseInt(localStorage.getItem('bcInvoiceCount') || '0', 10) + 1;
      localStorage.setItem('bcInvoiceCount', offlineCount);
      apply(offlineCount);
      return Promise.resolve();
    }

    el.value = 'Generating...';
    return API.getLookup(report, cfg.countField).then((list) => {
      const used = list.filter((r) => r.label.indexOf(yearPrefix) === 0).length;
      apply(used + 1);
    }).catch((err) => {
      console.error('Failed to fetch invoice numbers from "' + report + '".', err);
      apply(0);
    });
  }

  /* Design Type and Shape are lookups; cache id -> name for each master so an
     item row that carries only the id can still be shown by name. */
  let designTypeNames = {};
  let shapeNames = {};

  function loadLookupMasters() {
    if (!API.hasSDK()) return Promise.resolve();
    const masters = [
      { report: C.reports.designType, label: C.designTypeFields.label, set: (m) => { designTypeNames = m; } },
      { report: C.reports.shape, label: C.shapeFields.label, set: (m) => { shapeNames = m; } }
    ];
    return Promise.all(masters.map((m) =>
      API.getLookup(m.report, m.label).then((list) => {
        const byId = {};
        list.forEach((s) => { byId[String(s.ID)] = s.label; });
        m.set(byId);
        console.log('[barcode] ' + m.report + ': ' + list.length + ' rows');
      }).catch(() => {})
    ));
  }

  /* Creator link names vary in case and punctuation, so a field is matched exactly
     first and then on a normalised key (design_code / DesignCode / designcode ...). */
  const normKey = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');

  function matchingKeys(row, candidates) {
    const keys = [];
    candidates.forEach((c) => { if (c in row && keys.indexOf(c) < 0) keys.push(c); });
    const wanted = candidates.map(normKey);
    Object.keys(row).forEach((k) => {
      if (wanted.indexOf(normKey(k)) > -1 && keys.indexOf(k) < 0) keys.push(k);
    });
    return keys;
  }

  /* Plain text value of the first matching field. */
  function fieldText(row, candidates) {
    const keys = matchingKeys(row, candidates);
    for (let i = 0; i < keys.length; i++) {
      const text = U.zohoText(row[keys[i]]);
      if (text) return text;
    }
    return '';
  }

  /* Name of a lookup value. The master map wins, because a lookup that arrives as a
     bare id would otherwise render as its digits; plain numeric text is never shown. */
  function lookupName(row, candidates, nameById) {
    const keys = matchingKeys(row, candidates);
    for (let i = 0; i < keys.length; i++) {
      const value = row[keys[i]];
      const id = rawId(value);
      if (id && nameById[id]) return nameById[id];
      const text = U.zohoText(value);
      if (text && !/^[0-9]+$/.test(text)) return text;
    }
    return '';
  }

  /* Full Item_Master_Report records, fetched on demand and kept per id. */
  const itemDetailCache = {};

  function itemDetail(id) {
    if (itemDetailCache[id]) return Promise.resolve(itemDetailCache[id]);
    return API.getRecordById(C.reports.itemMaster, id).then((rec) => {
      if (rec) itemDetailCache[id] = rec;
      return rec;
    });
  }

  /* Item_Master_Report names, cached once and reused by every modal open. */
  let itemMasterList = null;

  function loadItemMaster() {
    if (!API.hasSDK()) { itemMasterList = []; return Promise.resolve(); }
    return API.getLookup(C.reports.itemMaster, C.itemMasterFields.label).then((list) => {
      itemMasterList = list;
      list.forEach((s) => {
        const cat = categoryOf(s.row);
        if (cat) itemCategoryById[s.ID] = cat;
      });
      const found = Object.keys(itemCategoryById).length;
      console.log('[barcode] ' + C.reports.itemMaster + ': ' + list.length + ' items, ' +
        found + ' with a category');
      if (!found && list.length) {
        console.warn('[barcode] None of ' + JSON.stringify(C.itemMasterFields.categoryCandidates) +
          ' matched on the ' + C.reports.itemMaster + ' listing. Its rows carry: ' +
          Object.keys(list[0].row).join(', '));
        console.warn('[barcode] first item record:', list[0].row);
      }
    }).catch(() => { itemMasterList = null; });
  }

  /* Option value is the item's name, not its record ID, because Barcode_Item stores
     Item_Name as text — the ID rides along in data-id for later use. */
  function fillItemNames(sel, selected) {
    sel.innerHTML = '<option value="">Select Item</option>';

    if (!API.hasSDK()) {
      sel.innerHTML += '<option value="" disabled>Unavailable outside Zoho Creator</option>';
      return;
    }
    if (itemMasterList === null) {
      sel.innerHTML += '<option value="" disabled>Failed to load from ' + C.reports.itemMaster + '</option>';
      return;
    }
    if (!itemMasterList.length) {
      sel.innerHTML += '<option value="" disabled>No records in ' + C.reports.itemMaster + '</option>';
      return;
    }

    itemMasterList.forEach((s) => {
      const o = document.createElement('option');
      o.value = s.label;
      o.textContent = s.label;
      o.dataset.id = s.ID;
      sel.appendChild(o);
    });

    if (selected) sel.value = U.zohoText(selected);
  }

  /* Rows of Purchase_Entry_Report + Material_Receive_Report, cached once so the
     supplier totals can be recomputed on every selection without re-querying. */
  let sourceRows = [];

  function loadSourceRows() {
    return Promise.all(C.sourceReports.map((src) =>
      API.getRecords(src.report).then((rows) => {
        console.log('[barcode] ' + src.report + ': ' + rows.length + ' rows', rows[0] || '');
        /* keep each row paired with the supplier field its own report uses */
        return rows.map((row) => ({ row: row, supplierField: src.supplierField, report: src.report }));
      })
    )).then((sets) => {
      sourceRows = Array.prototype.concat.apply([], sets);
    });
  }

  /* A lookup value arrives either as a bare id or as an object carrying one. */
  const rawId = (v) => (v && typeof v === 'object') ? String(v.ID || v.id || '') : (v == null ? '' : String(v));

  /* True when this receiving row belongs to the given supplier. Matches the report's
     own supplier field on record ID or on display name — Creator returns a lookup
     as either a bare ID or an object carrying both. */
  function rowIsSupplier(entry, id, name) {
    const wantedId = String(id || '');
    const wantedName = String(name || '').trim().toLowerCase();
    if (!wantedId && !wantedName) return false;

    const value = entry.row[entry.supplierField];
    if (value === undefined) return false;
    if (wantedId && rawId(value) === wantedId) return true;
    return !!wantedName && U.zohoText(value).toLowerCase() === wantedName;
  }

  /* Total_Net_Weight and Total_Qty received from one supplier. */
  function supplierTotals(id, name) {
    const F = C.sourceFields;
    return sourceRows.filter((e) => rowIsSupplier(e, id, name)).reduce((a, e) => ({
      weight: a.weight + U.num(U.zohoText(e.row[F.netWeight])),
      nos: a.nos + U.num(U.zohoText(e.row[F.qty]))
    }), { weight: 0, nos: 0 });
  }

  /* Resolved once at startup and reused every time the entry modal opens. */
  let currentSM = null;

  /* Ported from loadCurrentUserAsSalesman() in the Sales Invoice widget: take the
     logged-in email from the SDK, then find that person in Employee_Report. */
  function loadCurrentUser() {
    if (!API.hasSDK()) {
      currentSM = { ID: '', label: 'Unavailable outside Zoho Creator' };
      return Promise.resolve();
    }

    return API.getLoginUser().then((email) => {
      if (!email) {
        currentSM = { ID: '', label: 'Unable to detect logged-in user' };
        return;
      }
      const wanted = email.toLowerCase();
      return API.getLookup(C.reports.employee, C.employeeFields.name).then((list) => {
        const match = list.find((s) => {
          const configured = U.zohoText(s.row[C.employeeFields.email]).toLowerCase();
          if (configured === wanted) return true;
          /* fall back to any field holding the address, as the reference does */
          return Object.keys(s.row).some((k) => U.zohoText(s.row[k]).toLowerCase() === wanted);
        });
        /* name, then a bare Name field, then the email — never the record ID */
        const name = match &&
          (U.zohoText(match.row[C.employeeFields.name]) || U.zohoText(match.row.Name) || email);
        currentSM = match ? { ID: match.ID, label: name } : { ID: '', label: email };
      }).catch((err) => {
        console.error('Failed to look up employee in "' + C.reports.employee + '".', err);
        currentSM = { ID: '', label: email };
      });
    });
  }

  const NUMERIC = [
    'Gross_Weight', 'Net_Weight', 'Tag_Weight', 'MRP', 'Making_Charge', 'Discount',
    'Qty', 'Purchase_Rate', 'Retail_Rate',
    'CSS_Weight', 'CSS_Rate', 'CSS_Purchase_Rate', 'CSS_Retail_Rate',
    'DMD_Weight', 'DMD_Rate', 'DMD_Purchase_Rate', 'DMD_Retail_Rate',
    'PS_Weight', 'PS_Rate', 'PS_Purchase_Rate', 'PS_Retail_Rate',
    'Service_Value', 'Service_Amount',
    'Hallmarking_Charge', 'Certification_Charge', 'Other_Charge'
  ];

  /* The Barcode record carries the voucher header: its date, the generated invoice
     number, and the two lookups. Supplier on the entry form is the vendor.
     `itemRows` becomes the Item_Details subform — the whole array every time,
     because Creator replaces a subform rather than appending to it. */
  function buildBarcodeRecord(supplierId, itemRows, barcodeText) {
    const F = C.barcodeFormFields;
    const data = {};

    /* a blank name in barcodeFormFields means "do not send this field", so the
       name is checked alongside the value — data[''] would otherwise be set. */
    const put = (field, value) => { if (field && value) data[field] = value; };

    put(F.voucherDate, U.zohoDate($('#voucherDate').value || S.state.voucher.voucherDate));
    put(F.invoiceNo, S.state.voucher.invoiceNumber || $('#invoiceNumber').value);
    put(F.priceLevel, $('#priceLevel').value);
    put(F.vendor, supplierId || $('#vendor').value);
    put(F.barcode, barcodeText);

    if (F.itemDetails && itemRows && itemRows.length) data[F.itemDetails] = itemRows;

    return data;
  }

  /* Field link names the Item_Details subform actually has, read once from
     Barcode_Item_Details_Report. Empty means "unknown", and then the configured
     map is trusted as written. */
  let subformFieldNames = null;

  function loadSubformFields() {
    if (!API.hasSDK() || !C.reports.barcodeItemDetails) return Promise.resolve();
    return API.getRecords(C.reports.barcodeItemDetails).then((rows) => {
      if (!rows.length) {
        console.warn('[barcode] "' + C.reports.barcodeItemDetails + '" has no rows yet, so the ' +
          'Item_Details field names could not be read. Falling back to C.subformKnownFields.');
        return;
      }
      /* A report listing only surfaces what its layout carries, and a column
         added after those rows were written may not come back at all — so the
         probe is merged with the configured list rather than replacing it.
         Dropping a field we have been told exists loses data silently; the
         filter is only here to catch names that are outright wrong. */
      const probed = Object.keys(rows[0]);
      subformFieldNames = probed.concat(
        C.subformKnownFields.filter((n) => probed.indexOf(n) === -1)
      );
      console.log('[barcode] Item_Details fields from the report:', probed);
      const onlyConfigured = C.subformKnownFields.filter((n) => probed.indexOf(n) === -1);
      if (onlyConfigured.length) {
        console.log('[barcode] not in the report listing, trusted from C.subformKnownFields: ' +
          onlyConfigured.join(', '));
      }
      /* the values matter as much as the names: a lookup comes back as an object,
         a plain number as a number, which is how Purity/Design get diagnosed. */
      console.log('[barcode] sample Item_Details row:', rows[0]);
      const unknown = Object.keys(C.subformFields)
        .map((k) => C.subformFields[k] && C.subformFields[k].field)
        .filter((name) => name && subformFieldNames.indexOf(name) === -1);
      if (unknown.length) {
        console.warn('[barcode] These C.subformFields names are on neither the report nor ' +
          'C.subformKnownFields, so they will be dropped: ' + unknown.join(', '));
      }
    });
  }

  /* The entry form collects text ("BC-145857", "22K") while most of the subform is
     NUMBER/DECIMAL, and Creator fails the whole submit on a type mismatch rather
     than skipping the field. Every value is coerced to its declared type first. */
  /* digits only. U.num keeps a leading "-", which would turn BC-145857 negative. */
  const digitsOf = (v) => parseInt(String(v == null ? '' : v).replace(/\D/g, ''), 10) || 0;

  /* Pulls a lookup id off the selected Item_Master record. matchingKeys tolerates
     the report naming a field slightly differently from the candidate list. */
  function itemMasterLookupId(itemMasterRow, candidates) {
    if (!itemMasterRow) return '';
    const keys = matchingKeys(itemMasterRow, candidates || []);
    for (let i = 0; i < keys.length; i++) {
      const id = rawId(itemMasterRow[keys[i]]);
      if (id) return id;
    }
    return '';
  }

  function coerceSubformValue(value, map, ctx) {
    const type = map.type;
    /* Creator takes a lookup as the record id; sent as-is because Number() on a
       non-numeric id yields NaN, which serialises to null and fails the submit. */
    if (type === 'itemLookup') return ctx.itemMasterId ? String(ctx.itemMasterId) : '';
    if (type === 'itemMasterId') return itemMasterLookupId(ctx.itemMasterRow, map.source);
    /* the form control already holds a record id — send it, never its label */
    if (type === 'lookupId') return value ? String(value) : '';
    if (type === 'number') return digitsOf(value);
    if (type === 'decimal') return U.num(value);
    return value == null ? '' : String(value);
  }

  /* types whose value comes from the selected item, not the entry form's fields */
  const SYNTHETIC_TYPES = ['itemLookup', 'itemMasterId'];

  /* One Item_Details row built from the entry form. Names the subform does not
     have are dropped — sending an unknown field makes Creator reject the whole
     Barcode record, which would lose the voucher as well as the item. */
  function buildSubformRow(raw, itemMasterId, itemMasterRow) {
    const row = {};
    const names = subformFieldNames || C.subformKnownFields;
    const ctx = { itemMasterId: itemMasterId, itemMasterRow: itemMasterRow };
    const LOOKUPS = ['itemLookup', 'itemMasterId', 'lookupId'];

    Object.keys(C.subformFields).forEach((key) => {
      const map = C.subformFields[key];
      if (!map || !map.field) return;
      if (SYNTHETIC_TYPES.indexOf(map.type) === -1 && !(key in raw)) return;
      if (names && names.indexOf(map.field) === -1) {
        console.warn('[barcode] subform has no field "' + map.field + '" — ' + key + ' not sent.');
        return;
      }
      const value = coerceSubformValue(raw[key], map, ctx);
      /* an empty lookup is omitted rather than sent blank — Creator rejects "" */
      if (LOOKUPS.indexOf(map.type) > -1 && !value) {
        if (map.type === 'lookupId') {
          console.warn('[barcode] ' + key + ' was left unselected — ' + map.field + ' not sent.');
        } else {
          console.warn('[barcode] no id for ' + map.field + ' — not sent. Looked for ' +
            JSON.stringify(map.source || ['<the selected item>']) + ' on the Item_Master record, ' +
            'which has: ' + (itemMasterRow ? Object.keys(itemMasterRow).join(', ') : '(not loaded)'));
        }
        return;
      }
      row[map.field] = value;
    });

    return row;
  }

  /* Creator replaces a subform wholesale on update, so every row that should
     survive has to be sent back in full. Carrying the row's ID keeps it the same
     row instead of a duplicate; lookups are unwrapped to their record id, and
     Creator's own columns (Added_Time and friends) are left out because
     subformKnownFields lists only the writable ones. */
  function subformRowForUpdate(row) {
    const out = {};
    if (row.ID) out.ID = row.ID;
    C.subformKnownFields.forEach((name) => {
      if (!(name in row)) return;
      const value = row[name];
      if (value === null || value === '') return;
      out[name] = (value && typeof value === 'object') ? rawId(value) : value;
    });
    return out;
  }

  /* Rows already on the voucher, ready to be resent. Empty when this session has
     not created a voucher — the table is then showing the whole report, and those
     rows belong to other vouchers and must never be written back here. */
  function existingSubformRows() {
    if (!S.state.voucher.recordId) return [];
    return S.state.items.map(subformRowForUpdate);
  }

  function writeSubform(recordId, rows, barcodeText) {
    const F = C.barcodeFormFields;
    const patch = {};
    patch[F.itemDetails] = rows;
    if (F.barcode && barcodeText) patch[F.barcode] = barcodeText;
    return API.updateRecord(C.reports.barcode, recordId, patch);
  }

  /* Which voucher owns a listed row. Until this session saves something the table
     lists the whole report, so rows can belong to any voucher — and rewriting one
     voucher's subform with another's rows would wipe both. The parent is found
     first and its own rows are what get rewritten.

     A report listing omits subform arrays, so each candidate is opened by id;
     the session's own voucher is tried first and the rest newest-first, stopping
     at the first match. Results are cached, one lookup per row at most. */
  /* Editing and deleting act on Barcode_Item_Details_Report directly — the row's
     own report — rather than rewriting the parent voucher's whole subform array.
     That is both safer (nothing else on the voucher is touched) and simpler: no
     hunt for which Barcode record owns the row, which is what used to fail with
     "Could not find the voucher this row belongs to."

     The listed rows come from that same report, so row.ID addresses the record.
     If a row somehow has no usable ID, it is looked up by its barcode instead. */
  function itemDetailId(row) {
    if (row && row.ID) return Promise.resolve(String(row.ID));
    const code = row ? (row.Barcode1 || row.Barcode) : '';
    return API.findItemDetailByBarcode(code).then((found) => {
      if (!found) {
        throw new Error('No row for barcode "' + code + '" in ' +
          C.reports.barcodeItemDetails + '.');
      }
      return String(found.ID);
    });
  }

  function deleteSubformRow(row) {
    return itemDetailId(row)
      .then((id) => API.deleteRecord(C.reports.barcodeItemDetails, id));
  }

  function replaceSubformRow(row, newRow) {
    return itemDetailId(row)
      .then((id) => API.updateRecord(C.reports.barcodeItemDetails, id, newRow));
  }

  /* A subform row is keyed by the subform's field names; the entry form is built
     from its own. Reversing the map lets Edit reopen the form with the row's
     values — lookups render as their display text, which is what the Item Name
     dropdown matches on. */
  function entryFormValues(subRow) {
    const out = {};
    Object.keys(C.subformFields).forEach((key) => {
      const map = C.subformFields[key];
      if (!map || !map.field || !(map.field in subRow)) return;
      const v = subRow[map.field];
      /* Item Name's dropdown is keyed by label, every other lookup by record id —
         each control has to be given back the form of value it selects on. */
      if (v && typeof v === 'object') {
        out[key] = (map.type === 'itemLookup') ? U.zohoText(v) : rawId(v);
      } else {
        out[key] = v;
      }
    });
    return out;
  }

  /* Adds one row to the session's Item_Details subform. The first save creates the
     Barcode voucher and remembers its id; later saves update that same record with
     the full row list, so a session produces one Barcode Report line whose Item
     Details grows, not a new line per item. */
  function saveVoucherItem(itemRow, supplierId, barcodeText) {
    if (!API.hasSDK()) return Promise.resolve();

    const V = S.state.voucher;
    const rows = existingSubformRows().concat([itemRow]);

    if (!V.recordId) {
      return API.addRecord(C.forms.barcode, buildBarcodeRecord(supplierId, rows, barcodeText)).then((res) => {
        console.log('[barcode] created ' + C.forms.barcode + ' record:', res);
        const id = res && res.data && res.data.ID;
        if (!id) {
          console.warn('[barcode] addRecord returned no ID, so the next item will start a new ' +
            'voucher instead of joining this one.');
        }
        S.setVoucher({ recordId: id || '' });
        return res;
      });
    }

    return writeSubform(V.recordId, rows, barcodeText);
  }

  function readRaw(form) {
    const raw = {};
    new FormData(form).forEach((v, k) => { raw[k] = v; });
    NUMERIC.forEach((k) => { if (k in raw) raw[k] = U.num(raw[k]); });
    return raw;
  }

  /* ---------------- actions ---------------- */

  function openItemModal(row) {
    const editing = !!row;
    /* `row` is a subform row; the form is built from entry-form field names */
    const formRow = editing ? entryFormValues(row) : null;
    UI.openModal(
      editing ? 'Edit Barcode' : 'Add New Barcode',
      UI.barcodeFormHTML(formRow),
      '',
      { wide: true, headActions: UI.barcodeHeadActions() }
    );

    const form = $('#itemForm');
    const field = (name) => form.querySelector('[name="' + name + '"]');

    /* Closing the entry form reloads the widget, so what is behind it is rebuilt
       from Creator rather than left on whatever the session had in memory. The
       X and the backdrop both do it; a programmatic close after saving an edit
       does not, since that path already reloads the item list itself. */
    $('#modalRoot').querySelectorAll('[data-close]').forEach((el) => {
      el.addEventListener('click', () => window.location.reload());
    });

    /* The supplier list is the vendor list — reuse the options already fetched
       for the voucher card instead of hitting Vendor_Report a second time. */
    const supplier = $('#bcSupplier');
    Array.prototype.forEach.call($('#vendor').options, (o) => {
      if (o.value) supplier.appendChild(o.cloneNode(true));
    });
    /* Default to the vendor picked on the voucher card — read the select itself,
       which is the live truth, before falling back to stored state. */
    supplier.value = (formRow && formRow.Supplier) || $('#vendor').value || S.state.voucher.vendor || '';

    /* SM is the logged-in Creator user, resolved at startup. */
    const sm = $('#bcSM');
    if (currentSM) {
      sm.innerHTML = `<option value="${U.esc(currentSM.ID)}" selected>${U.esc(currentSM.label)}</option>`;
    }

    fillItemNames($('#bcItemName'), formRow && formRow.Item_Name);

    /* Purity comes from its own master; the option value is that record's id, so
       an edited row preselects on the id entryFormValues kept for it. */
    fillSelect($('#bcPurity'), 'Select Purity', C.reports.purityMaster, C.purityMasterFields.label)
      .then(() => {
        if (formRow && formRow.Purity) $('#bcPurity').value = formRow.Purity;
      });

    /* ---- item details strip ---- */
    const itemSelect = $('#bcItemName');
    const itemDetails = $('#bcItemDetails');
    const DETAIL_FIELDS = ['Design_Type', 'Design_Code', 'Design_Name', 'Shape'];

    function fillItemDetails(src) {
      const M = C.itemMasterFields;
      field('Design_Type').value = lookupName(src, M.designTypeCandidates, designTypeNames);
      field('Design_Code').value = fieldText(src, M.designCodeCandidates);
      field('Design_Name').value = fieldText(src, M.designNameCandidates);
      field('Shape').value = lookupName(src, M.shapeCandidates, shapeNames);
    }

    /* Item_Master record id behind the selected Item Name, for a subform field
       that is a lookup rather than plain text. */
    function selectedItemMasterId() {
      const opt = itemSelect.options[itemSelect.selectedIndex];
      return (opt && opt.dataset) ? (opt.dataset.id || '') : '';
    }

    /* The listing row carries only what Item_Master_Report displays as columns;
       itemDetailCache holds the complete record fetched when the item was picked.
       Merged, so Purity/Design resolve from whichever one has them. */
    function selectedItemMasterRow() {
      const id = selectedItemMasterId();
      if (!id) return null;
      const entry = itemMasterList
        ? itemMasterList.find((s) => String(s.ID) === String(id))
        : null;
      return Object.assign({}, entry ? entry.row : {}, itemDetailCache[id] || {});
    }

    function applyItemDetails() {
      const opt = itemSelect.options[itemSelect.selectedIndex];
      const id = opt && opt.dataset ? opt.dataset.id : '';
      const entry = (id && itemMasterList)
        ? itemMasterList.find((s) => String(s.ID) === String(id))
        : null;

      if (!entry) {
        DETAIL_FIELDS.forEach((n) => { if (field(n)) field(n).value = ''; });
        itemDetails.hidden = true;
        return;
      }

      fillItemDetails(entry.row);
      itemDetails.hidden = false;

      /* the listing often omits fields the report does not display, so pull the
         complete record and fill again once it arrives */
      itemDetail(id).then((rec) => {
        if (!rec) return;
        const current = itemSelect.options[itemSelect.selectedIndex];
        if (!current || current.dataset.id !== id) return;
        console.log('[barcode] item "' + opt.value + '" full record:', rec);
        console.log('[barcode] Item_Master fields available for Purity/Design mapping:',
          Object.keys(rec).join(', '));
        fillItemDetails(Object.assign({}, entry.row, rec));
      });
    }

    itemSelect.addEventListener('change', applyItemDetails);
    applyItemDetails();

    if (!editing) {
      API.nextBarcode().then((code) => {
        if (field('Barcode') && !field('Barcode').value) field('Barcode').value = code;
      });
    }

    /* ---- live calculation ---- */
    function recalc() {
      /* Net weight only deducts the CSS/DMD/PS stone weights, not Tag Weight —
         Tag Weight is the tagged-in figure kept for reference/comparison only. */
      const gross = U.num(field('Gross_Weight').value);
      const cssWeight = U.num(field('CSS_Weight').value);
      const dmdWeight = U.num(field('DMD_Weight').value) * 0.20; // DMD is entered in CT, converted to grams
      const psWeight = U.num(field('PS_Weight').value);
      const net = Math.max(0, gross - cssWeight - dmdWeight - psWeight);
      field('Net_Weight').value = net.toFixed(3);

      /* Service & Charges. Percentage assumes a placeholder rate of ₹1000/gm until a
         real rate master is wired in; Per Rate/gm and Per Piece use the entered value as-is. */
      const serviceType = field('Service_Type').value;
      const serviceValue = U.num(field('Service_Value').value);
      let serviceAmount = 0;
      if (serviceType === 'percentage') serviceAmount = (serviceValue / 100) * net * 1000;
      else if (serviceType === 'rate') serviceAmount = serviceValue * net;
      else if (serviceType === 'piece') serviceAmount = serviceValue;
      field('Service_Amount').value = serviceAmount.toFixed(2);

      renderBalance();
    }

    /* Total is what the selected supplier delivered across both receiving reports.
       Balance is that total less this entry — Net Weight against the weight, Qty
       against the count. With no supplier figures to draw down, both read 0 rather
       than going negative on the Qty that every new row starts with. */
    function renderBalance() {
      const chosen = supplier.options[supplier.selectedIndex];
      const total = supplierTotals(supplier.value, chosen ? chosen.textContent : '');
      const hasTotal = total.weight > 0 || total.nos > 0;

      const set = (id, value, unit) => {
        $('#' + id).innerHTML = value + (unit ? `<small>${unit}</small>` : '');
      };
      set('bcTotalWeight', total.weight.toFixed(3), 'gm');
      set('bcTotalNos', String(total.nos), '');
      set('bcWeightBalance', (hasTotal ? total.weight - U.num(field('Net_Weight').value) : 0).toFixed(3), 'gm');
      set('bcNosBalance', String(hasTotal ? total.nos - U.num(field('Qty').value) : 0), '');
    }

    form.addEventListener('input', recalc);
    /* selects fire change, not input, in some browsers — the supplier drives the
       balance panel, so make sure switching it recomputes */
    form.addEventListener('change', recalc);
    recalc();

    /* ---- header actions ---- */
    $('#bcChkCss').addEventListener('change', (e) => { $('#bcSecCss').hidden = !e.target.checked; });
    $('#bcChkDmd').addEventListener('change', (e) => { $('#bcSecDmd').hidden = !e.target.checked; });
    $('#bcChkPs').addEventListener('change', (e) => { $('#bcSecPs').hidden = !e.target.checked; });
    $('#bcListBtn').addEventListener('click', UI.closeModal);

    /* V2's Reset: everything clears except Basic Information, so the operator keeps
       date, supplier, SM and barcode while entering the next piece. */
    $('#bcReset').addEventListener('click', () => {
      const basic = $('#bcSecBasic');
      form.querySelectorAll('input, select').forEach((el) => {
        if (basic && basic.contains(el)) return;
        if (el.type === 'checkbox') { el.checked = false; return; }
        if (el.tagName === 'SELECT') { el.selectedIndex = 0; return; }
        el.value = el.classList.contains('bc-calc') ? '0.00' : '';
      });

      $('#bcChkCss').checked = false;
      $('#bcChkDmd').checked = false;
      $('#bcChkPs').checked = false;
      $('#bcChkCamera').checked = false;
      $('#bcSecCss').hidden = true;
      $('#bcSecDmd').hidden = true;
      $('#bcSecPs').hidden = true;
      clearImage();
      recalc();
    });

    /* After a successful add the modal stays open so the operator can key the
       next piece straight in. Everything clears except the supplier — the one
       value that holds across a run of items from the same delivery. Date and
       SM go back to their defaults rather than blank, which is what a fresh
       form would have shown anyway. */
    function resetForNextEntry(savedBarcode) {
      form.querySelectorAll('input, select').forEach((el) => {
        if (el === supplier || el === sm) return;
        if (el.type === 'checkbox') { el.checked = false; return; }
        if (el.tagName === 'SELECT') { el.selectedIndex = 0; return; }
        el.value = el.classList.contains('bc-calc') ? '0.00' : '';
      });
      field('Voucher_Date').value = U.today();
      field('Qty').value = 1;

      $('#bcChkCss').checked = false;
      $('#bcChkDmd').checked = false;
      $('#bcChkPs').checked = false;
      $('#bcChkCamera').checked = false;
      $('#bcSecCss').hidden = true;
      $('#bcSecDmd').hidden = true;
      $('#bcSecPs').hidden = true;
      clearImage();
      applyItemDetails();
      recalc();
      field('Barcode').value = bumpBarcode(savedBarcode);
      itemSelect.focus();
    }

    /* The next barcode: one past the highest code on the voucher and past the
       one just saved. API.nextBarcode reads Barcode_Item, which nothing writes
       any more, so asking it again would hand back the same code every time. */
    function bumpBarcode(justSaved) {
      const digits = (v) => U.num(U.zohoText(v).replace(/\D/g, ''));
      let max = digits(justSaved);
      S.state.items.forEach((r) => {
        max = Math.max(max, digits(r.Barcode1), digits(r.Barcode));
      });
      return 'BC-' + (max + 1);
    }

    const newSubGroup = $('#bcNewSubGroup');
    if (newSubGroup) {
      newSubGroup.addEventListener('click', () => {
        const name = window.prompt('New sub group name');
        if (!name) return;
        const o = document.createElement('option');
        o.textContent = name;
        o.selected = true;
        $('#bcSubGroup').appendChild(o);
      });
    }

    /* ---- image ---- */
    const drop = $('#bcDrop');
    const file = $('#bcFile');
    const preview = (f) => {
      if (!f || !/^image\//.test(f.type)) return;
      const reader = new FileReader();
      reader.onload = () => {
        drop.dataset.image = reader.result;
        $('#bcDropImg').src = reader.result;
        $('#bcDropPrev').hidden = false;
        $('#bcDropPh').hidden = true;
      };
      reader.readAsDataURL(f);
    };
    drop.addEventListener('click', () => file.click());
    file.addEventListener('change', (e) => preview(e.target.files[0]));
    drop.addEventListener('dragover', (e) => e.preventDefault());
    drop.addEventListener('drop', (e) => { e.preventDefault(); preview(e.dataTransfer.files[0]); });
    document.addEventListener('paste', function onPaste(e) {
      if (!document.body.contains(drop)) return document.removeEventListener('paste', onPaste);
      const item = Array.prototype.find.call(e.clipboardData.items, (i) => /^image\//.test(i.type));
      if (item) preview(item.getAsFile());
    });

    function clearImage() {
      drop.dataset.image = '';
      file.value = '';
      $('#bcDropImg').src = '';
      $('#bcDropPrev').hidden = true;
      $('#bcDropPh').hidden = false;
    }

    $('#bcRemoveImg').addEventListener('click', (e) => {
      e.stopPropagation();
      clearImage();
    });

    /* ---- mandatory fields ---- */

    /* Checked the same way as the vendor gate on the toolbar — a red outline on
       every empty field and one toast — rather than the browser's own bubble,
       which the scrolling modal body can leave pointing off screen. The toast
       stays generic: the outlines already say which fields are missing. */
    const REQUIRED = [
      { name: 'Barcode',      label: 'Barcode' },
      { name: 'Item_Name',    label: 'Item Name' },
      { name: 'Purity',       label: 'Purity' },
      { name: 'Gross_Weight', label: 'Gross Weight' }
    ];

    function flagInvalid(el) {
      el.classList.add('bc-invalid');
      const clear = () => {
        el.classList.remove('bc-invalid');
        el.removeEventListener('change', clear);
        el.removeEventListener('input', clear);
      };
      el.addEventListener('change', clear);
      el.addEventListener('input', clear);
    }

    function validateEntry() {
      let missing = null;
      REQUIRED.forEach((r) => {
        const el = field(r.name);
        if (!el) return;
        if (String(el.value || '').trim()) { el.classList.remove('bc-invalid'); return; }
        flagInvalid(el);
        if (!missing) missing = r;
      });
      if (!missing) return true;
      UI.toast('Please fill the required fields', 'error');
      const el = field(missing.name);
      el.scrollIntoView({ block: 'center' });
      el.focus();
      return false;
    }

    /* ---- save ---- */
    $('#bcSave').addEventListener('click', () => {
      if (!validateEntry()) return;
      const raw = readRaw(form);
      UI.loading(true);
      const subRow = buildSubformRow(raw, selectedItemMasterId(), selectedItemMasterRow());
      /* Only the Item_Details subform is written. The old parallel write to the
         Barcode_Item form is gone: nothing reads All_Barcode_Items any more, so
         it could only ever fail the save of a row that had already gone in. */
      /* Only meaningful when a voucher already exists — the first save switches
         the list from the whole report to this voucher alone, so the row count
         legitimately drops and there is nothing to wait for. */
      const hadVoucher = !!S.state.voucher.recordId;
      const expected = (!editing && hadVoucher) ? S.state.items.length + 1 : 0;

      const req = editing
        ? replaceSubformRow(row, subRow)
        : saveVoucherItem(subRow, supplier.value, raw.Barcode);

      req.then(() => {
        UI.toast(editing ? 'Barcode updated' : 'Barcode added', 'success');
        /* An edit is done once it is saved; an add is not — the modal stays open
           and clears itself for the next piece. */
        if (editing) UI.closeModal();
        /* the item list has to come back first: the next barcode is derived
           from the codes already on the voucher */
        return loadItems(expected).then(() => {
          if (!editing) resetForNextEntry(raw.Barcode);
        });
      }).catch((err) => {
        /* the modal stays open on failure so the entered values are not lost */
        console.error('[barcode] save failed:', err);
        UI.toast('Save failed: ' + U.errText(err), 'error');
      }).then(() => UI.loading(false));
    });
  }

  function confirmDelete(row) {
    UI.openModal(
      'Delete Item',
      `<p class="bc-confirm">Delete <strong>${U.esc(U.zohoText(row.Item_Detail) || 'this row')}</strong> from the voucher? This cannot be undone.</p>`,
      `<button class="bc-btn" data-close="1">Cancel</button>
       <button class="bc-btn bc-btn-danger" id="confirmDelete">Delete</button>`
    );
    $('#confirmDelete').addEventListener('click', () => {
      UI.loading(true);
      deleteSubformRow(row).then(() => {
        UI.closeModal();
        UI.toast('Item deleted', 'success');
        return loadItems();
      }).catch((err) => UI.toast('Delete failed: ' + U.errText(err), 'error'))
        .then(() => UI.loading(false));
    });
  }

  /* Options come from the rows on screen rather than the static C.categories /
     C.purities lists, because the subform's Item and Purity are lookups whose
     values are whatever those masters hold. */
  function distinctValues(key) {
    const seen = [];
    S.state.items.forEach((r) => {
      const v = U.zohoText(r[key]);
      if (v && seen.indexOf(v) === -1) seen.push(v);
    });
    return seen.sort();
  }

  function openFilterModal() {
    const f = S.state.filters;
    const opts = (list, sel) =>
      ['<option value="">All</option>'].concat(
        list.map((o) => `<option${o === sel ? ' selected' : ''}>${U.esc(o)}</option>`)
      ).join('');
    UI.openModal('Filter Items',
      `<form id="filterForm" class="bc-form-grid">
        <label class="bc-field"><span>Item</span><select name="Item_Detail">${opts(distinctValues('Item_Detail'), f.Item_Detail)}</select></label>
        <label class="bc-field"><span>Purity</span><select name="Purity">${opts(distinctValues('Purity'), f.Purity)}</select></label>
      </form>`,
      `<button class="bc-btn" id="clearFilters">Clear</button>
       <button class="bc-btn bc-btn-primary" id="applyFilters">Apply</button>`
    );
    $('#applyFilters').addEventListener('click', () => {
      new FormData($('#filterForm')).forEach((v, k) => S.setFilter(k, v));
      UI.closeModal();
    });
    $('#clearFilters').addEventListener('click', () => {
      Object.keys(S.state.filters).forEach((k) => S.setFilter(k, ''));
      UI.closeModal();
    });
  }

  function openSortModal() {
    const sortable = C.columns.filter((c) => c.sortable !== false);
    UI.openModal('Sort Items',
      `<form id="sortForm" class="bc-form-grid">
        <label class="bc-field"><span>Sort by</span>
          <select name="key">${sortable.map((c) =>
            `<option value="${c.key}"${S.state.sort.key === c.key ? ' selected' : ''}>${U.esc(c.label)}</option>`
          ).join('')}</select></label>
        <label class="bc-field"><span>Direction</span>
          <select name="dir">
            <option value="asc"${S.state.sort.dir === 'asc' ? ' selected' : ''}>Ascending</option>
            <option value="desc"${S.state.sort.dir === 'desc' ? ' selected' : ''}>Descending</option>
          </select></label>
      </form>`,
      `<button class="bc-btn" data-close="1">Cancel</button>
       <button class="bc-btn bc-btn-primary" id="applySort">Apply</button>`
    );
    $('#applySort').addEventListener('click', () => {
      const fd = new FormData($('#sortForm'));
      S.state.sort = { key: fd.get('key'), dir: fd.get('dir') };
      UI.closeModal();
      UI.renderAll();
    });
  }

  function openColumnsModal() {
    UI.openModal('Toggle Columns',
      `<div class="bc-checklist">${C.columns.map((c) => `
        <label class="bc-check">
          <input type="checkbox" value="${c.key}" ${S.state.hiddenColumns.has(c.key) ? '' : 'checked'} />
          <span>${U.esc(c.label)}</span>
        </label>`).join('')}</div>`,
      `<button class="bc-btn bc-btn-primary" data-close="1">Done</button>`
    );
    document.querySelectorAll('.bc-checklist input').forEach((cb) => {
      cb.addEventListener('change', () => S.toggleColumn(cb.value));
    });
  }

  function exportCSV() {
    const cols = S.visibleColumns().filter((c) => c.type !== 'action');
    const csv = U.toCSV(S.visibleItems(), cols);
    U.download(`barcodes-${S.state.voucher.sessionId || 'session'}.csv`, csv, 'text/csv;charset=utf-8');
    UI.toast('Exported ' + S.visibleItems().length + ' items', 'success');
  }

  function importCSV() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv,text/csv';
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const rows = U.parseCSV(String(reader.result));
        if (rows.length < 2) return UI.toast('CSV has no data rows', 'error');
        const header = rows[0].map((h) => h.trim());
        const colByLabel = {};
        C.columns.forEach((c) => { colByLabel[c.label.toUpperCase()] = c.key; });

        const records = rows.slice(1).map((r) => {
          const rec = {};
          header.forEach((h, i) => {
            const key = colByLabel[h.toUpperCase()] || h;
            rec[key] = r[i];
          });
          ['Gross_Weight', 'Net_Weight', 'MRP', 'Making_Charge', 'Discount'].forEach((k) => {
            rec[k] = U.num(rec[k]);
          });
          rec.Net_Amount = rec.MRP + rec.Making_Charge - rec.Discount;
          if (S.state.voucher.sessionId) rec.Session_ID = S.state.voucher.sessionId;
          if (S.state.voucher.invoiceNumber) rec[C.invoiceNumberConfig.itemField] = S.state.voucher.invoiceNumber;
          delete rec.no;
          delete rec.action;
          return rec;
        });

        UI.loading(true);
        records.reduce((chain, rec) => chain.then(() => API.addItem(rec)), Promise.resolve())
          .then(() => {
            UI.toast('Imported ' + records.length + ' items', 'success');
            return loadItems();
          })
          .catch((err) => UI.toast('Import failed: ' + U.errText(err), 'error'))
          .then(() => UI.loading(false));
      };
      reader.readAsText(file);
    });
    input.click();
  }

  function printLabels() {
    const rows = S.visibleItems();
    if (!rows.length) return UI.toast('Nothing to print', 'error');
    /* subform field names — the label used to read Item_Name/MRP off the old
       Barcode_Item rows, which these are not. */
    const labels = rows.map((r) => `
      <div class="label">
        <div class="bars">${U.code39SVG(r.Barcode1 || r.Barcode, { height: 44, scale: 1.5 })}</div>
        <div class="name">${U.esc(U.zohoText(r.Item_Detail))}</div>
        <div class="meta">${U.esc(U.zohoText(r.Purity))} &middot; ${U.fmt.weight(r.Net_Weight)}g</div>
      </div>`).join('');

    const win = window.open('', '_blank');
    if (!win) return UI.toast('Popup blocked — allow popups to print', 'error');
    win.document.write(`<!DOCTYPE html><html><head><title>Barcode Labels</title><style>
      body{font-family:system-ui,sans-serif;margin:12px;display:flex;flex-wrap:wrap;gap:8px}
      .label{width:320px;border:1px solid #d5d9e0;border-radius:6px;padding:8px;text-align:center;page-break-inside:avoid}
      .bars{margin:4px 0}
      .bc-barcode{display:block;stroke:none}
      .bc-barcode rect{stroke:none;stroke-width:0}
      .bc-barcode-text{display:block;margin-top:2px;font:600 11px/1.2 monospace;letter-spacing:1.5px}
      .name{font-size:11px;font-weight:600;margin-top:2px}
      .meta{font-size:10px;color:#6b7280}
      /* bars must print at full contrast, not as a lightened background image */
      @media print{body{margin:0}.bc-barcode{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
    </style></head><body>${labels}</body></html>`);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 300);
  }


  /* ---------------- events ---------------- */

  /* A barcode belongs to a vendor's delivery: the entry form defaults Supplier
     from this select and the balance panel is drawn from that vendor's totals,
     so there is nothing sensible to add until one is picked. */
  function requireVendor() {
    const vendor = $('#vendor');
    if (vendor.value) { vendor.classList.remove('bc-invalid'); return true; }
    vendor.classList.add('bc-invalid');
    vendor.addEventListener('change', function clear() {
      vendor.classList.remove('bc-invalid');
      vendor.removeEventListener('change', clear);
    });
    UI.toast('Select a vendor before adding a barcode', 'error');
    vendor.focus();
    return false;
  }

  function bind() {
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (btn) {
        const action = btn.dataset.action;
        if (action === 'add') { if (requireVendor()) openItemModal(null); }
        else if (action === 'refresh') loadItems();
        else if (action === 'reset') { S.reset(); $('#searchInput').value = ''; }
        else if (action === 'export') exportCSV();
        else if (action === 'import') importCSV();
        else if (action === 'print') printLabels();
        else if (action === 'filter') openFilterModal();
        else if (action === 'sort') openSortModal();
        else if (action === 'columns') openColumnsModal();
        return;
      }

      const rowBtn = e.target.closest('[data-row-action]');
      if (rowBtn) {
        e.preventDefault();
        const row = S.state.items.find((r) => String(r.ID) === rowBtn.dataset.id);
        if (!row) return;
        if (rowBtn.dataset.rowAction === 'edit') openItemModal(row);
        else confirmDelete(row);
        return;
      }

      const th = e.target.closest('th[data-sort-key]');
      if (th) S.toggleSort(th.dataset.sortKey);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') UI.closeModal();
    });

    $('#searchInput').addEventListener('input', U.debounce((e) => S.setSearch(e.target.value), 200));

    ['voucherDate', 'vendor', 'invoiceNumber', 'priceLevel'].forEach((id) => {
      $('#' + id).addEventListener('change', (e) => S.setVoucher({ [id]: e.target.value }));
    });
  }

  /* ---------------- init ---------------- */

  function initApp() {
    S.subscribe(UI.renderAll);
    bind();
    UI.renderVoucher();
    UI.renderAll();

    if (!API.hasSDK()) {
      UI.showOffline('ZOHO.CREATOR.API is not available on this page.');
    }

    return Promise.all([
      loadInvoiceNumber(),
      loadVendors(),
      loadPriceLevels(),
      loadCurrentUser(),
      loadLookupMasters(),
      loadSubformFields(),
      loadSourceRows(),
      /* items are listed with a category taken from the item master, so that map
         has to exist first — otherwise every row triggers its own lookup */
      loadItemMaster().then(() => loadItems())
    ]);
  }

  /* Same handshake as the Sales Invoice widget — wait for init() inside Creator,
     fall back to window.onload without the SDK — but never let a pending init()
     stop the UI from rendering. Outside a Creator host frame that promise simply
     never settles, which leaves the whole page dead. */
  function boot() {
    if (typeof ZOHO === 'undefined' || !ZOHO.CREATOR) {
      window.onload = initApp;
      return;
    }

    let started = false;
    const start = () => { if (!started) { started = true; initApp(); } };

    setTimeout(() => {
      if (!started) {
        console.warn('[barcode] ZOHO.CREATOR.init() has not responded — the widget is not embedded in a Creator page.');
        UI.showOffline('ZOHO.CREATOR.init() never responded, so no Creator session is available.');
        start();
      }
    }, 6000);

    ZOHO.CREATOR.init().then(function () {
      return API.initParams()
        .then((p) => { if (p && p.sessionId) S.setVoucher({ sessionId: p.sessionId }); })
        .catch(() => {});
    }).catch((err) => {
      console.error('[barcode] ZOHO.CREATOR.init() failed.', err);
    }).then(start);
  }

  boot();
})();

</script>
</body>
