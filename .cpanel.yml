# cPanel Git Version Control deployment file.
#
# When you click "Deploy HEAD Commit" (or "Update from Remote" + Deploy) on
# this repo's Git Version Control page in cPanel, cPanel runs the commands
# below in order, in one persistent shell session (exported vars and `cd`
# carry over between lines — this is cPanel's own convention).
#
# This account's Python App root lives *inside* the git checkout itself
# (/home/schoolm1/repositories/school-erp/backend), so there's no separate
# "deployment path" to copy files to — pulling the repo already updates the
# live code in place. What's left, in order:
#   1. Activate the backend's own virtualenv (the one Setup Python App made).
#   2. Install/update backend dependencies in that virtualenv.
#   3. Run Alembic migrations against every tenant school database (safe to
#      run repeatedly — see backend/manage_migrations.py).
#   4. Touch Passenger's restart file so the running app picks up the new
#      code on the next request.
#
# This file does NOT create the Cron Job that fires run_scheduled_fees.py —
# that's a one-time manual step in cPanel's Cron Jobs page (see SETUP.md
# "Scheduled fee auto-generation" -> "Wiring it up in cPanel").
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/schoolm1/repositories/school-erp/
    - source /home/schoolm1/virtualenv/repositories/school-erp/backend/3.11/bin/activate
    - cd $DEPLOYPATH/backend && pip install -q -r requirements.txt
    - cd $DEPLOYPATH/backend && python manage_migrations.py upgrade head
    - /bin/touch $DEPLOYPATH/backend/tmp/restart.txt
