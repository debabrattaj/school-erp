# cPanel Git Version Control deployment file.
#
# When you click "Deploy HEAD Commit" (or "Update from Remote" + Deploy) on
# this repo's Git Version Control page in cPanel, cPanel runs the commands
# below in order, in one persistent shell session (exported vars and `cd`
# carry over between lines — this is cPanel's own convention).
#
# This account's Python App root lives *inside* the git checkout itself
# (/home/schoolm1/repositories/school-erp/backend), so there's no separate
# "deployment path" to copy files to — pulling the repo already updates the
# live code in place. What's left, in order:
#   1. Activate the backend's own virtualenv (the one Setup Python App made).
#   2. Install/update backend dependencies in that virtualenv.
#   3. Run Alembic migrations against every tenant school database (safe to
#      run repeatedly — see backend/manage_migrations.py).
#   4. Touch Passenger's restart file so the running app picks up the new
#      code on the next request.
#
# This file does NOT create the Cron Job that fires run_scheduled_fees.py —
# that's a one-time manual step in cPanel's Cron Jobs page (see SETUP.md
# "Scheduled fee auto-generation" -> "Wiring it up in cPanel").
#
# The marketing site (landing-page/) is plain static HTML/CSS/JS — no build
# step, no Node process. It deploys by mirroring landing-page/ straight into
# the domain's document root with rsync --delete, so the docroot always ends
# up an exact copy of what's in git (anything removed from landing-page/ is
# removed from the live docroot too). PUBLIC_HTML below MUST be changed to
# schoolment.com's real document root before this runs — see SETUP.md
# "Marketing site deployment" for how to find it and for the --delete caveat.
#
# CRITICAL: PUBLIC_HTML is NOT exclusive to the marketing site. Known
# subdirectories that must stay excluded:
#   - school-admin/  — the admin app frontend. This is ALSO the document
#                      root of the login.schoolment.com subdomain, and is
#                      where frontend/'s build output gets deployed below.
#   - school-erp/    — Passenger routing stub for the backend Python App,
#                      mounted at schoolment.com/school-erp (App Root is
#                      elsewhere, at repositories/school-erp/backend, but
#                      cPanel still creates this path stub under the docroot)
#   - nodebuild/     — docroot of the nodebuild.schoolment.com subdomain,
#                      used only to provision the Node/npm build environment
#                      for frontend/ (see SETUP.md §17), never started as a
#                      live app
#   - .well-known/   — SSL/ACME verification files
#   - cgi-bin/       — cPanel's own cgi-bin
# --delete will erase any of these the next time this runs if they're not
# excluded (this has already happened once to school-admin — see git
# history / SETUP.md §16). If anything else ever gets added under
# $PUBLIC_HTML outside of landing-page/'s own files, add it to --exclude
# here BEFORE the next deploy, not after.
#
# THE FRONTEND IS NOT BUILT HERE. This deploy covers the backend and the
# marketing site only; frontend/ (the admin app) is built off-server and its
# dist/ uploaded by hand into public_html/school-admin/.
#
# That is not a preference, it is what this host allows. Three separate walls
# were hit trying to build here, each a hard limit of the shared CloudLinux
# account rather than something fixable in config:
#   1. Vite 8's rolldown needs Node >= 20.19; this host caps at 20.18.3.
#      (Worked around by downgrading to Vite 5 — that part is genuine.)
#   2. esbuild's Go runtime cannot spawn its threads under the LVE process
#      cap: "failed to create new OS thread (have 17 already; errno=11)".
#   3. The build then died on the LVE memory cap:
#      "WebAssembly.instantiate(): Out of memory: Cannot allocate Wasm memory".
#
# The build tasks were removed rather than left in place to fail, because a
# failing task aborts the whole deploy: cPanel then reports the deployment as
# failed and never updates "Last Deployed", even though the backend, the
# migrations and the marketing site had all already applied successfully.
# Leaving them in made every deploy look broken when only the last step was.
#
# Deploying the admin app, until this account moves to a host that can build:
#   1. Build it wherever you can run Node properly:
#        cd frontend && VITE_API_BASE_URL=https://schoolment.com/school-erp npm run build
#   2. Upload the CONTENTS of frontend/dist/ into public_html/school-admin/,
#      including the hidden .htaccess — without it every deep link
#      (/platform-login and friends) 404s, since React Router routes have no
#      matching file on disk.
#
# Built with base='/' (Vite's default) since login.schoolment.com's docroot IS
# school-admin/ directly — the app is reached at that subdomain's root, not at
# a /school-admin/ subpath under the main domain (see frontend/vite.config.js).
# See SETUP.md §18 for the CORS setting this depends on.
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/schoolm1/repositories/school-erp/
    - source /home/schoolm1/virtualenv/repositories/school-erp/backend/3.11/bin/activate
    - cd $DEPLOYPATH/backend && pip install -q -r requirements.txt
    - cd $DEPLOYPATH/backend && python manage_migrations.py upgrade head
    - /bin/mkdir -p $DEPLOYPATH/backend/tmp
    - /bin/touch $DEPLOYPATH/backend/tmp/restart.txt
    - export PUBLIC_HTML=/home/schoolm1/public_html
    - /usr/bin/rsync -a --delete --exclude='.well-known' --exclude='cgi-bin' --exclude='school-admin' --exclude='nodebuild' --exclude='school-erp' $DEPLOYPATH/landing-page/ $PUBLIC_HTML/
